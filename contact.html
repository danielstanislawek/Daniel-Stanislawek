    <style>
        :root {
            --paper: #FBF9F5;
            --ink: #201D18;
            --accent: #6B4226;
            --accent-light: #8C5A2B;
            --muted: #8A8578;
            --border: #E4DED2;
        }
        * { box-sizing: border-box; }

        /* General Styles */
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--ink);
            background: var(--paper);
            margin: 0;
        }
        .page-wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }
        .two-col {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 2.5em;
        }
        .col-photo img {
            width: 100%;
            max-width: 260px;
            height: auto;
            border-radius: 6px;
        }
        @media (max-width: 750px) {
            .two-col {
                grid-template-columns: 1fr;
            }
            .col-photo img {
                max-width: 160px;
            }
        }

        /* Header / Nav */
        header.site-header {
            border-bottom: 1px solid var(--border);
            margin-bottom: 2em;
        }
        .nav-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.1em 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 600;
            font-size: 1.35em;
            color: var(--ink);
            text-decoration: none;
        }
        nav.links {
            display: flex;
            gap: 1.75em;
        }
        nav.links a {
            color: var(--ink);
            text-decoration: none;
            font-size: 0.95em;
            padding-bottom: 3px;
            border-bottom: 1px solid transparent;
        }
        nav.links a:hover {
            border-bottom-color: var(--accent);
            color: var(--accent);
        }
        .hamburger {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.4em;
            flex-direction: column;
            gap: 5px;
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--ink);
        }
        .mobile-menu {
            display: none;
            flex-direction: column;
            padding: 0 20px 1em;
        }
        .mobile-menu a {
            color: var(--ink);
            text-decoration: none;
            padding: 0.6em 0;
            border-bottom: 1px solid var(--border);
        }
        .mobile-menu.open { display: flex; }
        @media (max-width: 700px) {
            nav.links { display: none; }
            .hamburger { display: flex; }
        }

        /* Photo sizing handled by .col-photo img in the two-col grid */

        /* Heading Styles */
        h1 {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 500;
        }
        h2 {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 500;
            font-size: 1.6em;
            margin-top: 1.5em;
            margin-bottom: 0.8em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3em;
            color: var(--ink);
        }

        /* Link Styling for Video Items */
        a.video-item {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
            margin-right: 5px;
            cursor: pointer;
            display: inline;
        }
        a.video-item:hover {
            text-decoration: underline;
            color: var(--accent-light);
        }

        /* Styling for Song Entry Container */
        .song-entry {
            display: block;
            margin-bottom: 8px;
        }

        /* Bottom nav */
        nav.bottom-nav {
            margin-top: 2.5em;
            padding-top: 1.5em;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1.5em;
            flex-wrap: wrap;
        }
        nav.bottom-nav a {
            color: var(--accent);
            text-decoration: none;
            font-size: 1.05em;
        }
        nav.bottom-nav a:hover {
            text-decoration: underline;
            color: var(--accent-light);
        }

        /* Video Popup Styles (Unchanged from original) */
        #video-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
        }
        #video-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #close-popup {
            position: absolute;
            top: 15px;
            right: 25px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }
